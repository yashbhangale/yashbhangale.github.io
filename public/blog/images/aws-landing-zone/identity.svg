<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">Workforce access without shared credentials</title><desc id="desc">Identity authentication, account authorization, and organization limits are separate. Original anonymized reference illustration. No client identifiers.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#70818e" stroke-width="1.5"/></marker></defs><rect width="1200" height="790" fill="#0c1116"/><g font-family="Arial, sans-serif"><text x="48" y="65" fill="#e9e4d6" font-size="38" font-weight="700">Workforce access without shared credentials</text><text x="48" y="101" fill="#aeb8bd" font-size="20" font-weight="400">Identity authentication, account authorization, and organization limits are separate.</text><rect x="48" y="155" width="336" height="160" rx="12" fill="#151d24" stroke="#46535e"/><path d="M66 177h24" stroke="#72c8bb" stroke-width="3"/><text x="66" y="210" fill="#e9e4d6" font-size="23" font-weight="700">Corporate identity source</text><text x="66" y="242" fill="#aeb8bd" font-size="19" font-weight="400">Workforce groups and MFA</text><text x="66" y="269" fill="#aeb8bd" font-size="19" font-weight="400">Provider intentionally unspecified</text><rect x="468" y="155" width="336" height="160" rx="12" fill="#151d24" stroke="#46535e"/><path d="M486 177h24" stroke="#ffbd00" stroke-width="3"/><text x="486" y="210" fill="#e9e4d6" font-size="23" font-weight="700">IAM Identity Center</text><text x="486" y="242" fill="#aeb8bd" font-size="19" font-weight="400">SAML sign-in / SCIM provisioning</text><text x="486" y="269" fill="#aeb8bd" font-size="19" font-weight="400">Group-to-account assignments</text><path d="M384 235H468" fill="none" stroke="#70818e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="468" y="397" width="336" height="150" rx="12" fill="#151d24" stroke="#46535e"/><path d="M486 419h24" stroke="#ffbd00" stroke-width="3"/><text x="486" y="452" fill="#e9e4d6" font-size="23" font-weight="700">Permission sets</text><text x="486" y="484" fill="#aeb8bd" font-size="19" font-weight="400">Job-specific policies</text><text x="486" y="511" fill="#aeb8bd" font-size="19" font-weight="400">Reviewed session durations</text><path d="M636 315V397" fill="none" stroke="#70818e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="888" y="397" width="264" height="150" rx="12" fill="#151d24" stroke="#46535e"/><path d="M906 419h24" stroke="#9ab6e9" stroke-width="3"/><text x="906" y="452" fill="#e9e4d6" font-size="23" font-weight="700">Account role</text><text x="906" y="484" fill="#aeb8bd" font-size="19" font-weight="400">Temporary session</text><text x="906" y="511" fill="#aeb8bd" font-size="19" font-weight="400">Console / CLI access</text><path d="M804 473H888" fill="none" stroke="#70818e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="48" y="397" width="336" height="150" rx="12" fill="#151d24" stroke="#46535e"/><path d="M66 419h24" stroke="#9ab6e9" stroke-width="3"/><text x="66" y="452" fill="#e9e4d6" font-size="23" font-weight="700">SCP boundary</text><text x="66" y="484" fill="#aeb8bd" font-size="19" font-weight="400">Limits member-account actions</text><text x="66" y="511" fill="#aeb8bd" font-size="19" font-weight="400">Does not grant permissions</text><path d="M216 547V594H1020V547" fill="none" stroke="#70818e" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="48" y="665" fill="#e9e4d6" font-size="21" font-weight="400">Separate recovery path: secured, monitored, and tested before it is needed.</text><path d="M48 726H1152" stroke="#34414b"/><text x="48" y="760" fill="#aeb8bd" font-size="17" font-weight="400">Original reference diagram · Generic labels · Production details withheld</text><text x="1070" y="760" fill="#ffbd00" font-size="18" font-weight="700">YB</text></g></svg>