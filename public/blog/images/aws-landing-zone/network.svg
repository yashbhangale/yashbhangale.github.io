<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110" role="img" aria-labelledby="title desc"><title id="title">Private workload spokes, deliberate routes</title><desc id="desc">Logical view in ap-south-1. Each AZ needs its own validated forward and return path. Original anonymized reference illustration. No client identifiers.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#70818e" stroke-width="1.5"/></marker></defs><rect width="1200" height="1110" fill="#0c1116"/><g font-family="Arial, sans-serif"><text x="48" y="65" fill="#e9e4d6" font-size="38" font-weight="700">Private workload spokes, deliberate routes</text><text x="48" y="101" fill="#aeb8bd" font-size="20" font-weight="400">Logical view in ap-south-1. Each AZ needs its own validated forward and return path.</text><rect x="48" y="150" width="336" height="150" rx="12" fill="#151d24" stroke="#46535e"/><path d="M66 172h24" stroke="#9ab6e9" stroke-width="3"/><text x="66" y="205" fill="#e9e4d6" font-size="23" font-weight="700">Dev / UAT VPCs</text><text x="66" y="237" fill="#aeb8bd" font-size="19" font-weight="400">Private workload subnets</text><text x="66" y="264" fill="#aeb8bd" font-size="19" font-weight="400">Separate account boundaries</text><rect x="468" y="150" width="336" height="150" rx="12" fill="#151d24" stroke="#46535e"/><path d="M486 172h24" stroke="#ffbd00" stroke-width="3"/><text x="486" y="205" fill="#e9e4d6" font-size="23" font-weight="700">Production VPCs</text><text x="486" y="237" fill="#aeb8bd" font-size="19" font-weight="400">Private workload subnets</text><text x="486" y="264" fill="#aeb8bd" font-size="19" font-weight="400">No default path from Dev</text><rect x="888" y="150" width="264" height="150" rx="12" fill="#151d24" stroke="#46535e"/><path d="M906 172h24" stroke="#72c8bb" stroke-width="3"/><text x="906" y="205" fill="#e9e4d6" font-size="23" font-weight="700">Corporate network</text><text x="906" y="237" fill="#aeb8bd" font-size="19" font-weight="400">Approved hybrid link</text><text x="906" y="264" fill="#aeb8bd" font-size="19" font-weight="400">DX / VPN as designed</text><rect x="48" y="395" width="756" height="150" rx="12" fill="#151d24" stroke="#46535e"/><path d="M66 417h24" stroke="#ffbd00" stroke-width="3"/><text x="66" y="450" fill="#e9e4d6" font-size="23" font-weight="700">Transit Gateway</text><text x="66" y="482" fill="#aeb8bd" font-size="19" font-weight="400">Explicit route-table associations and propagation</text><text x="66" y="509" fill="#aeb8bd" font-size="19" font-weight="400">Segment production, non-production, and shared access</text><path d="M216 300V395" fill="none" stroke="#70818e" stroke-width="2"  marker-end="url(#arrow)"/><path d="M636 300V395" fill="none" stroke="#70818e" stroke-width="2"  marker-end="url(#arrow)"/><path d="M1020 300V468H804" fill="none" stroke="#70818e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="48" y="635" width="336" height="180" rx="12" fill="#151d24" stroke="#46535e"/><path d="M66 657h24" stroke="#ffbd00" stroke-width="3"/><text x="66" y="690" fill="#e9e4d6" font-size="23" font-weight="700">Inspection / egress VPC</text><text x="66" y="722" fill="#aeb8bd" font-size="19" font-weight="400">Network Firewall endpoints</text><text x="66" y="749" fill="#aeb8bd" font-size="19" font-weight="400">NAT and internet egress</text><text x="66" y="776" fill="#aeb8bd" font-size="19" font-weight="400">Symmetric stateful routing</text><rect x="468" y="635" width="336" height="180" rx="12" fill="#151d24" stroke="#46535e"/><path d="M486 657h24" stroke="#72c8bb" stroke-width="3"/><text x="486" y="690" fill="#e9e4d6" font-size="23" font-weight="700">DNS / shared services</text><text x="486" y="722" fill="#aeb8bd" font-size="19" font-weight="400">Resolver endpoints and rules</text><text x="486" y="749" fill="#aeb8bd" font-size="19" font-weight="400">Approved shared dependencies</text><text x="486" y="776" fill="#aeb8bd" font-size="19" font-weight="400">Private DNS design</text><rect x="888" y="635" width="264" height="180" rx="12" fill="#151d24" stroke="#46535e"/><path d="M906 657h24" stroke="#9ab6e9" stroke-width="3"/><text x="906" y="690" fill="#e9e4d6" font-size="23" font-weight="700">AWS endpoints</text><text x="906" y="722" fill="#aeb8bd" font-size="19" font-weight="400">Local S3 / DynamoDB</text><text x="906" y="749" fill="#aeb8bd" font-size="19" font-weight="400">Interface endpoints</text><text x="906" y="776" fill="#aeb8bd" font-size="19" font-weight="400">Policies and SGs</text><path d="M216 545V635" fill="none" stroke="#70818e" stroke-width="2"  marker-end="url(#arrow)"/><path d="M636 545V635" fill="none" stroke="#70818e" stroke-width="2"  marker-end="url(#arrow)"/><path d="M1020 635V568H1124V338H730V300" fill="none" stroke="#70818e" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="48" y="875" fill="#aeb8bd" font-size="19" font-weight="400">Solid lines: routed connectivity subject to policy. Dashed line: private service dependency.</text><text x="48" y="916" fill="#e9e4d6" font-size="20" font-weight="400">Gateway endpoints stay in each consuming VPC; they are not shared over Transit Gateway.</text><text x="48" y="961" fill="#aeb8bd" font-size="20" font-weight="400">Resource sharing does not create routes, attachments, or application permissions.</text><path d="M48 1046H1152" stroke="#34414b"/><text x="48" y="1080" fill="#aeb8bd" font-size="17" font-weight="400">Original reference diagram · Generic labels · Production details withheld</text><text x="1070" y="1080" fill="#ffbd00" font-size="18" font-weight="700">YB</text></g></svg>