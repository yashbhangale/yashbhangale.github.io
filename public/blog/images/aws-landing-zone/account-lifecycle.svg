<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="865" viewBox="0 0 1200 865" role="img" aria-labelledby="title desc"><title id="title">An account is ready when its checks pass</title><desc id="desc">A repeatable path from an approved request to an operable workload environment. Original anonymized reference illustration. No client identifiers.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#70818e" stroke-width="1.5"/></marker></defs><rect width="1200" height="865" fill="#0c1116"/><g font-family="Arial, sans-serif"><text x="48" y="65" fill="#e9e4d6" font-size="38" font-weight="700">An account is ready when its checks pass</text><text x="48" y="101" fill="#aeb8bd" font-size="20" font-weight="400">A repeatable path from an approved request to an operable workload environment.</text><rect x="48" y="160" width="336" height="160" rx="12" fill="#151d24" stroke="#46535e"/><path d="M66 182h24" stroke="#ffbd00" stroke-width="3"/><text x="66" y="215" fill="#e9e4d6" font-size="23" font-weight="700">1. Request and approve</text><text x="66" y="247" fill="#aeb8bd" font-size="19" font-weight="400">Owner, cost center, environment</text><text x="66" y="274" fill="#aeb8bd" font-size="19" font-weight="400">OU, data class, network profile</text><rect x="468" y="160" width="336" height="160" rx="12" fill="#151d24" stroke="#46535e"/><path d="M486 182h24" stroke="#ffbd00" stroke-width="3"/><text x="486" y="215" fill="#e9e4d6" font-size="23" font-weight="700">2. Provision / govern</text><text x="486" y="247" fill="#aeb8bd" font-size="19" font-weight="400">Control Tower Account Factory</text><text x="486" y="274" fill="#aeb8bd" font-size="19" font-weight="400">Selected version and baseline</text><path d="M384 240H468" fill="none" stroke="#70818e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="468" y="405" width="336" height="160" rx="12" fill="#151d24" stroke="#46535e"/><path d="M486 427h24" stroke="#9ab6e9" stroke-width="3"/><text x="486" y="460" fill="#e9e4d6" font-size="23" font-weight="700">3. Apply Terraform</text><text x="486" y="492" fill="#aeb8bd" font-size="19" font-weight="400">Additional account baseline</text><text x="486" y="519" fill="#aeb8bd" font-size="19" font-weight="400">Reviewed plan; scoped CI role</text><path d="M636 320V405" fill="none" stroke="#70818e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="888" y="405" width="264" height="160" rx="12" fill="#151d24" stroke="#46535e"/><path d="M906 427h24" stroke="#72c8bb" stroke-width="3"/><text x="906" y="460" fill="#e9e4d6" font-size="23" font-weight="700">4. Verify evidence</text><text x="906" y="492" fill="#aeb8bd" font-size="19" font-weight="400">Access, logs, routes</text><text x="906" y="519" fill="#aeb8bd" font-size="19" font-weight="400">Findings and restore</text><path d="M804 485H888" fill="none" stroke="#70818e" stroke-width="2"  marker-end="url(#arrow)"/><rect x="48" y="405" width="336" height="160" rx="12" fill="#151d24" stroke="#46535e"/><path d="M66 427h24" stroke="#ffbd00" stroke-width="3"/><text x="66" y="460" fill="#e9e4d6" font-size="23" font-weight="700">5. Handover / operate</text><text x="66" y="492" fill="#aeb8bd" font-size="19" font-weight="400">Owners, runbooks, budgets</text><text x="66" y="519" fill="#aeb8bd" font-size="19" font-weight="400">Access and drift reviews</text><path d="M1020 565V624H216V565" fill="none" stroke="#70818e" stroke-width="2"  marker-end="url(#arrow)"/><text x="600" y="655" fill="#72c8bb" font-size="18" font-weight="700">Pass</text><path d="M1020 405V365H636V405" fill="none" stroke="#70818e" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="853" y="353" fill="#aeb8bd" font-size="18" font-weight="400">Fail → remediate</text><text x="48" y="736" fill="#e9e4d6" font-size="23" font-weight="700">Account creation is one step. Operational acceptance is the finish line.</text><path d="M48 801H1152" stroke="#34414b"/><text x="48" y="835" fill="#aeb8bd" font-size="17" font-weight="400">Original reference diagram · Generic labels · Production details withheld</text><text x="1070" y="835" fill="#ffbd00" font-size="18" font-weight="700">YB</text></g></svg>