<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Time-slicing shares a GPU; it does not multiply its memory</title><desc id="desc">Illustrative four-allocation example. The client sharing ratio is not disclosed. Original reference illustration. No client identifiers.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#8b9ba7" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#0c1116"/><g font-family="Arial, sans-serif"><text x="56" y="76" font-size="43" fill="#e9e4d6" font-weight="700">Time-slicing shares a GPU; it does not multiply its memory</text><text x="56" y="120" font-size="23" fill="#aebbc4" font-weight="400">Illustrative four-allocation example. The client sharing ratio is not disclosed.</text><rect x="56" y="185" width="500" height="355" rx="12" fill="#151e26" stroke="#465562"/><path d="M76 207h32" stroke="#77cbbd" stroke-width="3"/><text x="76" y="244" font-size="27" fill="#e9e4d6" font-weight="700">Advertised shared allocations</text><text x="76" y="281" font-size="22" fill="#aebbc4" font-weight="400">Pod A requests one allocation</text><text x="76" y="313" font-size="22" fill="#aebbc4" font-weight="400">Pod B requests one allocation</text><text x="76" y="345" font-size="22" fill="#aebbc4" font-weight="400">Additional eligible model pods</text><text x="76" y="377" font-size="22" fill="#aebbc4" font-weight="400">Allocation count is configurable</text><text x="76" y="409" font-size="22" fill="#aebbc4" font-weight="400">These are not physical GPU counts</text><rect x="644" y="185" width="500" height="355" rx="12" fill="#151e26" stroke="#465562"/><path d="M664 207h32" stroke="#a9c7f5" stroke-width="3"/><text x="664" y="244" font-size="27" fill="#e9e4d6" font-weight="700">One physical accelerator</text><text x="664" y="281" font-size="22" fill="#aebbc4" font-weight="400">All models use the same VRAM</text><text x="664" y="313" font-size="22" fill="#aebbc4" font-weight="400">Compute time is shared</text><text x="664" y="345" font-size="22" fill="#aebbc4" font-weight="400">No per-allocation memory partition</text><text x="664" y="377" font-size="22" fill="#aebbc4" font-weight="400">Concurrent loading must fit</text><text x="664" y="409" font-size="22" fill="#aebbc4" font-weight="400">Latency changes with contention</text><path d="M556 360H644" fill="none" stroke="#8b9ba7" stroke-width="2.5"  marker-end="url(#a)"/><text x="56" y="625" font-size="28" fill="#e9e4d6" font-weight="700">g5.xlarge hardware</text><text x="56" y="673" font-size="23" fill="#aebbc4" font-weight="400">1 × NVIDIA A10G · 24 GB GPU memory · 4 vCPUs · 16 GiB host RAM</text><text x="56" y="733" font-size="24" fill="#ffbd00" font-weight="700">Validate VRAM, host RAM, CPU, and model-ready latency together.</text><path d="M56 830H1144" stroke="#34414c"/><text x="56" y="868" font-size="20" fill="#aebbc4" font-weight="400">Yash Bhangale · Anonymized engineering walkthrough</text><text x="850" y="868" font-size="18" fill="#aebbc4" font-weight="400">Original reference illustration</text></g></svg>