<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc"><title id="title">Request demand becomes pod demand, then node demand</title><desc id="desc">The metrics loop and the capacity loop make different decisions. Original reference illustration. No client identifiers.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#8b9ba7" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#0c1116"/><g font-family="Arial, sans-serif"><text x="56" y="76" font-size="43" fill="#e9e4d6" font-weight="700">Request demand becomes pod demand, then node demand</text><text x="56" y="120" font-size="23" fill="#aebbc4" font-weight="400">The metrics loop and the capacity loop make different decisions.</text><rect x="56" y="175" width="440" height="165" rx="12" fill="#151e26" stroke="#465562"/><path d="M76 197h32" stroke="#a9c7f5" stroke-width="3"/><text x="76" y="234" font-size="27" fill="#e9e4d6" font-weight="700">HTTP model traffic</text><text x="76" y="271" font-size="22" fill="#aebbc4" font-weight="400">Application exposes request metrics</text><text x="76" y="303" font-size="22" fill="#aebbc4" font-weight="400">Model-ready pods serve responses</text><rect x="580" y="175" width="440" height="165" rx="12" fill="#151e26" stroke="#465562"/><path d="M600 197h32" stroke="#a9c7f5" stroke-width="3"/><text x="600" y="234" font-size="27" fill="#e9e4d6" font-weight="700">Prometheus + Adapter</text><text x="600" y="271" font-size="22" fill="#aebbc4" font-weight="400">Scrape and calculate request rate</text><text x="600" y="303" font-size="22" fill="#aebbc4" font-weight="400">Expose Kubernetes custom metrics</text><rect x="1104" y="175" width="440" height="165" rx="12" fill="#151e26" stroke="#465562"/><path d="M1124 197h32" stroke="#77cbbd" stroke-width="3"/><text x="1124" y="234" font-size="27" fill="#e9e4d6" font-weight="700">Horizontal Pod Autoscaler</text><text x="1124" y="271" font-size="22" fill="#aebbc4" font-weight="400">Compare demand with target</text><text x="1124" y="303" font-size="22" fill="#aebbc4" font-weight="400">Adjust model Deployment replicas</text><path d="M496 258H580" fill="none" stroke="#8b9ba7" stroke-width="2.5"  marker-end="url(#a)"/><path d="M1020 258H1104" fill="none" stroke="#8b9ba7" stroke-width="2.5"  marker-end="url(#a)"/><rect x="56" y="470" width="720" height="188" rx="12" fill="#151e26" stroke="#465562"/><path d="M76 492h32" stroke="#77cbbd" stroke-width="3"/><text x="76" y="529" font-size="27" fill="#e9e4d6" font-weight="700">Existing shared GPU capacity</text><text x="76" y="566" font-size="22" fill="#aebbc4" font-weight="400">Scheduler tries CPU, RAM, and shared allocation slots</text><text x="76" y="598" font-size="22" fill="#aebbc4" font-weight="400">GPU memory and model readiness need separate checks</text><rect x="860" y="470" width="684" height="188" rx="12" fill="#151e26" stroke="#465562"/><path d="M880 492h32" stroke="#ffbd00" stroke-width="3"/><text x="880" y="529" font-size="27" fill="#e9e4d6" font-weight="700">Karpenter + EC2</text><text x="880" y="566" font-size="22" fill="#aebbc4" font-weight="400">Eligible unschedulable replicas trigger provisioning</text><text x="880" y="598" font-size="22" fill="#aebbc4" font-weight="400">g5.xlarge joins → GPU plugin initializes → model loads</text><path d="M1324 340V405H416V470" fill="none" stroke="#8b9ba7" stroke-width="2.5"  marker-end="url(#a)"/><text x="650" y="439" font-size="21" fill="#aebbc4" font-weight="400">New replica demand</text><path d="M776 565H860" fill="none" stroke="#8b9ba7" stroke-width="2.5"  marker-end="url(#a)"/><text x="788" y="542" font-size="17" fill="#ffbd00" font-weight="400">Pending</text><rect x="56" y="796" width="1488" height="145" rx="12" fill="#151e26" stroke="#465562"/><path d="M76 818h32" stroke="#77cbbd" stroke-width="3"/><text x="76" y="855" font-size="27" fill="#e9e4d6" font-weight="700">One usual worker; intended operating range up to three</text><text x="76" y="892" font-size="22" fill="#aebbc4" font-weight="400">Multiple models share each accelerator through NVIDIA time-slicing. HPA does not set the node count directly.</text><path d="M1202 658V796" fill="none" stroke="#8b9ba7" stroke-width="2.5"  marker-end="url(#a)"/><path d="M56 1030H1544" stroke="#34414c"/><text x="56" y="1068" font-size="20" fill="#aebbc4" font-weight="400">Yash Bhangale · Anonymized engineering walkthrough</text><text x="1250" y="1068" font-size="18" fill="#aebbc4" font-weight="400">Original reference illustration</text></g></svg>