<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc"><title id="title">What a 60% reduction means</title><desc id="desc">Normalized arithmetic illustrating the reported result. Not a billing export. Original reference illustration. No client identifiers.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#8b9ba7" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#0c1116"/><g font-family="Arial, sans-serif"><text x="56" y="76" font-size="43" fill="#e9e4d6" font-weight="700">What a 60% reduction means</text><text x="56" y="120" font-size="23" fill="#aebbc4" font-weight="400">Normalized arithmetic illustrating the reported result. Not a billing export.</text><text x="56" y="242" font-size="26" fill="#e9e4d6" font-weight="700">SageMaker baseline index</text><rect x="56" y="269" width="1000" height="73" rx="4" fill="#6c7d8c"/><text x="1080" y="315" font-size="29" fill="#e9e4d6" font-weight="700">100</text><text x="56" y="421" font-size="26" fill="#e9e4d6" font-weight="700">EKS serving comparison index</text><rect x="56" y="448" width="400" height="73" rx="4" fill="#77cbbd"/><text x="478" y="494" font-size="29" fill="#e9e4d6" font-weight="700">40</text><text x="56" y="602" font-size="28" fill="#ffbd00" font-weight="700">(100 − 40) ÷ 100 × 100 = 60% reduction</text><path d="M56 670H1144" stroke="#34414c"/><text x="56" y="708" font-size="20" fill="#aebbc4" font-weight="400">Yash Bhangale · Anonymized engineering walkthrough</text><text x="850" y="708" font-size="18" fill="#aebbc4" font-weight="400">Original reference illustration</text></g></svg>