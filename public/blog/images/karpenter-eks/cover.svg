<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">From SageMaker to shared GPU serving</title><desc id="desc">Amazon EKS · NVIDIA time-slicing · Prometheus Adapter + HPA · Karpenter Original reference illustration. No client identifiers.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#8b9ba7" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#0c1116"/><g font-family="Arial, sans-serif"><text x="56" y="76" font-size="43" fill="#e9e4d6" font-weight="700">From SageMaker to shared GPU serving</text><text x="56" y="120" font-size="23" fill="#aebbc4" font-weight="400">Amazon EKS · NVIDIA time-slicing · Prometheus Adapter + HPA · Karpenter</text><text x="56" y="190" font-size="27" fill="#e9e4d6" font-weight="700">Several models share g5.xlarge workers; HTTP demand drives the scaling loop.</text><rect x="56" y="248" width="440" height="176" rx="12" fill="#151e26" stroke="#465562"/><path d="M76 270h32" stroke="#a9c7f5" stroke-width="3"/><text x="76" y="307" font-size="27" fill="#e9e4d6" font-weight="700">HTTP metrics</text><text x="76" y="344" font-size="22" fill="#aebbc4" font-weight="400">Prometheus scrapes model demand</text><text x="76" y="376" font-size="22" fill="#aebbc4" font-weight="400">Per-model rate and labels</text><rect x="580" y="248" width="440" height="176" rx="12" fill="#151e26" stroke="#465562"/><path d="M600 270h32" stroke="#77cbbd" stroke-width="3"/><text x="600" y="307" font-size="27" fill="#e9e4d6" font-weight="700">Prometheus Adapter + HPA</text><text x="600" y="344" font-size="22" fill="#aebbc4" font-weight="400">Custom metrics → serving replicas</text><text x="600" y="376" font-size="22" fill="#aebbc4" font-weight="400">Pod scaling follows request demand</text><rect x="1104" y="248" width="440" height="176" rx="12" fill="#151e26" stroke="#465562"/><path d="M1124 270h32" stroke="#ffbd00" stroke-width="3"/><text x="1124" y="307" font-size="27" fill="#e9e4d6" font-weight="700">Karpenter</text><text x="1124" y="344" font-size="22" fill="#aebbc4" font-weight="400">Eligible unschedulable pods</text><text x="1124" y="376" font-size="22" fill="#aebbc4" font-weight="400">Provision another g5.xlarge</text><path d="M496 334H580" fill="none" stroke="#8b9ba7" stroke-width="2.5"  marker-end="url(#a)"/><path d="M1020 334H1104" fill="none" stroke="#8b9ba7" stroke-width="2.5"  marker-end="url(#a)"/><rect x="56" y="514" width="440" height="172" rx="12" fill="#151e26" stroke="#465562"/><path d="M76 536h32" stroke="#77cbbd" stroke-width="3"/><text x="76" y="573" font-size="27" fill="#e9e4d6" font-weight="700">Usual footprint: 1 node</text><text x="76" y="610" font-size="22" fill="#aebbc4" font-weight="400">Multiple model pods share GPU</text><text x="76" y="642" font-size="22" fill="#aebbc4" font-weight="400">Warm replicas / readiness policy</text><rect x="580" y="514" width="440" height="172" rx="12" fill="#151e26" stroke="#465562"/><path d="M600 536h32" stroke="#a9c7f5" stroke-width="3"/><text x="600" y="573" font-size="27" fill="#e9e4d6" font-weight="700">Burst capacity: node 2</text><text x="600" y="610" font-size="22" fill="#aebbc4" font-weight="400">More replicas need capacity</text><text x="600" y="642" font-size="22" fill="#aebbc4" font-weight="400">Time-slicing on eligible workers</text><rect x="1104" y="514" width="440" height="172" rx="12" fill="#151e26" stroke="#465562"/><path d="M1124 536h32" stroke="#a9c7f5" stroke-width="3"/><text x="1124" y="573" font-size="27" fill="#e9e4d6" font-weight="700">Target ceiling: 3 nodes</text><text x="1124" y="610" font-size="22" fill="#aebbc4" font-weight="400">Capacity limits and validation</text><text x="1124" y="642" font-size="22" fill="#aebbc4" font-weight="400">Not an instant hard-limit promise</text><path d="M1324 424V466H800V514" fill="none" stroke="#8b9ba7" stroke-width="2.5"  marker-end="url(#a)"/><path d="M1324 466V514" fill="none" stroke="#8b9ba7" stroke-width="2.5"  marker-end="url(#a)"/><text x="56" y="761" font-size="29" fill="#ffbd00" font-weight="700">Reported outcome: approximately 60% lower model-serving bill.</text><text x="56" y="803" font-size="23" fill="#aebbc4" font-weight="400">Combined migration, GPU sharing, request-driven replicas, and node autoscaling.</text><path d="M56 830H1544" stroke="#34414c"/><text x="56" y="868" font-size="20" fill="#aebbc4" font-weight="400">Yash Bhangale · Anonymized engineering walkthrough</text><text x="1250" y="868" font-size="18" fill="#aebbc4" font-weight="400">Original reference illustration</text></g></svg>